
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テストのきろく</title>

<style>
:root {
  font-family: system-ui, -apple-system, sans-serif;
  color: #24324a;
  background: #f4f8ff;
}
* { box-sizing: border-box; }
body { margin: 0; }
.wrap {
  max-width: 760px;
  margin: auto;
  padding: 18px 15px 60px;
}
h1 { font-size: 27px; margin: 8px 0; }
h2 { font-size: 19px; margin: 0 0 15px; }
.sub { color: #6b7890; font-size: 14px; }
.card {
  background: white;
  border-radius: 22px;
  padding: 21px;
  margin: 16px 0;
  box-shadow: 0 5px 20px #28466b0c;
}
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.metric {
  background: #edf5ff;
  border-radius: 16px;
  padding: 16px;
}
.metric strong {
  font-size: 27px;
  display: block;
  color: #2259b4;
}
.field {
  display: block;
  margin: 13px 0;
  font-weight: 700;
  font-size: 14px;
}
input, select {
  width: 100%;
  padding: 13px;
  border: 2px solid #dce5f3;
  border-radius: 13px;
  font-size: 17px;
  background: white;
  margin-top: 6px;
  color: #24324a;
}
button {
  border: 0;
  border-radius: 13px;
  padding: 13px 19px;
  background: #3477dc;
  color: white;
  font-size: 16px;
  font-weight: 750;
  cursor: pointer;
}
button.secondary {
  background: #e8f0fb;
  color: #2855a0;
}
button.danger {
  background: #ffe7e7;
  color: #a93232;
}
button.small {
  font-size: 13px;
  padding: 8px 11px;
}
button:disabled { opacity: .55; }
.actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}
.hide { display: none !important; }
.msg {
  min-height: 23px;
  color: #bb3547;
  font-size: 14px;
  overflow-wrap: anywhere;
}
.success { color: #13825c; }
.entry {
  border-top: 1px solid #e9edf5;
  padding: 14px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.entry strong { font-size: 17px; }
.entry .sub { overflow-wrap: anywhere; }
.score {
  font-size: 21px;
  font-weight: 800;
  color: #285ab3;
  white-space: nowrap;
}
.bar {
  height: 12px;
  background: #e6ecf5;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 7px;
}
.fill {
  height: 100%;
  background: #48a6dc;
  border-radius: 20px;
}
svg {
  max-width: 100%;
  height: auto;
}
#chart {
  width: 100%;
  overflow: hidden;
}
.empty {
  color: #77849b;
  text-align: center;
  padding: 20px;
}
.hint {
  font-size: 12px;
  color: #7b8798;
  line-height: 1.6;
}
</style>
</head>

<body>
<main class="wrap">

  <div class="top">
    <div>
      <h1>📚 テストのきろく</h1>
      <div class="sub">
        がんばりを記録して、成長を見よう！
      </div>
    </div>
    <button id="logout" class="secondary small hide">
      ログアウト
    </button>
  </div>

  <section id="auth" class="card">
    <h2>おうちの人とログイン</h2>
    <p class="sub">
      記録はアカウントごとに保存されます。
    </p>

    <label class="field">
      メールアドレス
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="example@email.com">
    </label>

    <label class="field">
      パスワード
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="6文字以上">
    </label>

    <div class="actions">
      <button id="login" type="button">
        ログイン
      </button>
      <button id="signup" type="button" class="secondary">
        はじめて登録
      </button>
    </div>

    <p id="authMsg" class="msg" aria-live="polite"></p>

    <p class="hint">
      登録時は確認メールが届く場合があります。
      保護者のメールアドレスを使ってください。
    </p>
  </section>

  <div id="app" class="hide">

    <section class="card">
      <h2>これまでの記録</h2>

      <div class="grid">
        <div class="metric">
          <span class="sub">テストの回数</span>
          <strong id="count">0回</strong>
        </div>

        <div class="metric">
          <span class="sub">平均得点率</span>
          <strong id="average">—</strong>
        </div>
      </div>

      <p id="best" class="sub"></p>
    </section>

    <section class="card">
      <h2 id="formTitle">✏️ テストを記録する</h2>

      <form id="scoreForm">

        <label class="field">
          教科
          <select id="subject" required>
            <option>国語</option>
            <option>算数</option>
            <option>理科</option>
            <option>社会</option>
            <option>英語</option>
            <option>その他</option>
          </select>
        </label>

        <label class="field">
          テストの範囲
          <input
            id="scope"
            maxlength="200"
            placeholder="例：小数のかけ算"
            required>
        </label>

        <label class="field">
          テストの日
          <input id="testDate" type="date" required>
        </label>

        <div class="grid">
          <label class="field">
            満点
            <input
              id="maxScore"
              type="number"
              min="0.01"
              max="10000"
              step="0.01"
              value="100"
              required>
          </label>

          <label class="field">
            自分の点数
            <input
              id="score"
              type="number"
              min="0"
              step="0.01"
              required>
          </label>
        </div>

        <div class="actions">
          <button id="save" type="submit">
            記録を保存
          </button>
          <button
            id="cancel"
            type="button"
            class="secondary hide">
            編集をやめる
          </button>
        </div>

        <p id="formMsg" class="msg" aria-live="polite"></p>
      </form>
    </section>

    <section class="card">
      <h2>📈 教科ごとの成長</h2>

      <label class="field">
        教科を選ぶ
        <select id="filter">
          <option value="all">すべて</option>
          <option>国語</option>
          <option>算数</option>
          <option>理科</option>
          <option>社会</option>
          <option>英語</option>
          <option>その他</option>
        </select>
      </label>

      <div id="chart"></div>

      <p class="hint">
        得点率（得点÷満点）で比較します。
        テストの難しさが違うことにも注意しよう。
      </p>
    </section>

    <section class="card">
      <h2>🗂 テストの点数表</h2>
      <div id="records"></div>
    </section>

  </div>
</main>

<script>
(function () {
  "use strict";

  var SUPABASE_URL =
    "https://stvevspjxtycrdyzbxea.supabase.co";

  var SUPABASE_KEY =
    "sb_publishable_wsMEg-YDXFJJRBh8-qNm3Q_IHk7VR-c";

  var db = null;
  var items = [];
  var editing = null;
  var currentUser = null;
  var ready = false;

  function $(id) {
    return document.getElementById(id);
  }

  function message(id, text, success) {
    var el = $(id);
    if (!el) return;
    el.textContent = text;
    el.className = success ? "msg success" : "msg";
  }

  function errorText(error) {
    return error && error.message
      ? error.message
      : String(error || "不明なエラー");
  }

  function report(error) {
    message("authMsg", "エラー：" + errorText(error));
  }

  window.addEventListener("error", function (event) {
    if (!ready) {
      report(
        event.error ||
        event.message ||
        "JavaScriptの実行エラー"
      );
    }
  });

  window.addEventListener(
    "unhandledrejection",
    function (event) {
      report(event.reason);
    }
  );

  function node(tag, className, value) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (value !== undefined) el.textContent = value;
    return el;
  }

  function percentage(record) {
    return Number(record.score) /
      Number(record.max_score) * 100;
  }

  function formatNumber(value) {
    return Number(value).toLocaleString("ja-JP", {
      maximumFractionDigits: 2
    });
  }

  function resetForm() {
    editing = null;
    $("scoreForm").reset();

    var now = new Date();
    var local = new Date(
      now.getTime() - now.getTimezoneOffset() * 60000
    );
    $("testDate").value =
      local.toISOString().slice(0, 10);

    $("maxScore").value = 100;
    $("formTitle").textContent =
      "✏️ テストを記録する";
    $("save").textContent = "記録を保存";
    $("cancel").classList.add("hide");
    message("formMsg", "");
  }

  async function load() {
    var result = await db
      .from("test_scores")
      .select(
        "id,subject,scope,test_date,max_score,score,created_at"
      )
      .order("test_date", { ascending: false })
      .order("created_at", { ascending: false });

    if (result.error) {
      message("formMsg", errorText(result.error));
      return;
    }

    items = result.data || [];
    render();
  }

  function render() {
    var selected = $("filter").value;

    var filtered = selected === "all"
      ? items
      : items.filter(function (r) {
          return r.subject === selected;
        });

    $("count").textContent = items.length + "回";

    var total = items.reduce(function (sum, r) {
      return sum + percentage(r);
    }, 0);

    $("average").textContent = items.length
      ? Math.round(total / items.length) + "%"
      : "—";

    $("best").textContent = filtered.length
      ? "この教科の自己ベスト：" +
        formatNumber(
          Math.max.apply(
            null,
            filtered.map(percentage)
          )
        ) + "%"
      : "";

    renderChart(filtered);
    renderRecords(filtered);
  }

  function renderRecords(data) {
    var root = $("records");
    root.replaceChildren();

    if (!data.length) {
      root.appendChild(
        node(
          "div",
          "empty",
          "まだ記録がありません。テストを登録しよう！"
        )
      );
      return;
    }

    data.forEach(function (r) {
      var row = node("div", "entry");
      var left = node("div");
      var right = node("div");

      left.appendChild(
        node("strong", "", r.subject + " ・ " + r.scope)
      );

      left.appendChild(
        node("div", "sub", r.test_date)
      );

      var bar = node("div", "bar");
      var fill = node("div", "fill");

      fill.style.width =
        Math.max(
          0,
          Math.min(100, percentage(r))
        ) + "%";

      bar.appendChild(fill);
      left.appendChild(bar);

      right.appendChild(
        node(
          "div",
          "score",
          formatNumber(r.score) +
          " / " +
          formatNumber(r.max_score)
        )
      );

      right.appendChild(
        node(
          "div",
          "sub",
          formatNumber(percentage(r)) + "%"
        )
      );

      var actions = node("div", "actions");

      var editButton =
        node("button", "secondary small", "編集");

      editButton.type = "button";
      editButton.onclick = function () {
        editRecord(r);
      };

      var deleteButton =
        node("button", "danger small", "削除");

      deleteButton.type = "button";
      deleteButton.onclick = function () {
        deleteRecord(r);
      };

      actions.appendChild(editButton);
      actions.appendChild(deleteButton);

      right.appendChild(actions);

      row.appendChild(left);
      row.appendChild(right);
      root.appendChild(row);
    });
  }

  function renderChart(data) {
    var root = $("chart");
    root.replaceChildren();

    var ordered = data.slice().sort(function (a, b) {
      return a.test_date.localeCompare(b.test_date);
    });

    if (!ordered.length) {
      root.appendChild(
        node(
          "div",
          "empty",
          "記録するとグラフが表示されます"
        )
      );
      return;
    }

    var width = 620;
    var height = 230;
    var pad = 36;
    var ns = "http://www.w3.org/2000/svg";

    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute(
      "viewBox",
      "0 0 " + width + " " + height
    );
    svg.setAttribute("role", "img");
    svg.setAttribute(
      "aria-label",
      "テスト得点率の推移"
    );

    function line(x1, y1, x2, y2, color) {
      var el = document.createElementNS(ns, "line");
      el.setAttribute("x1", x1);
      el.setAttribute("y1", y1);
      el.setAttribute("x2", x2);
      el.setAttribute("y2", y2);
      el.setAttribute("stroke", color);
      el.setAttribute("stroke-width", 1);
      svg.appendChild(el);
    }

    function text(x, y, value) {
      var el = document.createElementNS(ns, "text");
      el.setAttribute("x", x);
      el.setAttribute("y", y);
      el.setAttribute("font-size", 12);
      el.setAttribute("fill", "#78869b");
      el.textContent = value;
      svg.appendChild(el);
    }

    for (var p = 0; p <= 100; p += 25) {
      var y = height - pad -
        p / 100 * (height - pad * 2);

      line(pad, y, width - pad, y, "#e3eaf4");
      text(0, y + 4, p + "%");
    }

    var points = ordered.map(function (r, i) {
      var x = ordered.length === 1
        ? width / 2
        : pad + i * (width - pad * 2) /
          (ordered.length - 1);

      var y = height - pad -
        Math.min(100, percentage(r)) / 100 *
        (height - pad * 2);

      return {
        x: x,
        y: y,
        value: percentage(r)
      };
    });

    for (var i = 1; i < points.length; i++) {
      line(
        points[i - 1].x,
        points[i - 1].y,
        points[i].x,
        points[i].y,
        "#3176d7"
      );
    }

    points.forEach(function (p) {
      var circle =
        document.createElementNS(ns, "circle");

      circle.setAttribute("cx", p.x);
      circle.setAttribute("cy", p.y);
      circle.setAttribute("r", 5);
      circle.setAttribute("fill", "#3176d7");

      var title =
        document.createElementNS(ns, "title");

      title.textContent =
        formatNumber(p.value) + "%";

      circle.appendChild(title);
      svg.appendChild(circle);
    });

    root.appendChild(svg);
  }

  function editRecord(r) {
    editing = r.id;

    $("subject").value = r.subject;
    $("scope").value = r.scope;
    $("testDate").value = r.test_date;
    $("maxScore").value = r.max_score;
    $("score").value = r.score;

    $("formTitle").textContent =
      "✏️ 記録を編集する";

    $("save").textContent = "変更を保存";
    $("cancel").classList.remove("hide");

    $("scoreForm").scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }

  async function deleteRecord(r) {
    if (!confirm(
      r.subject + "「" + r.scope +
      "」の記録を削除しますか？"
    )) return;

    try {
      var result = await db
        .from("test_scores")
        .delete()
        .eq("id", r.id);

      if (result.error) throw result.error;
      await load();
    } catch (error) {
      alert(errorText(error));
    }
  }

  async function saveRecord(event) {
    event.preventDefault();

    if (!currentUser) {
      message("formMsg", "ログインしてください");
      return;
    }

    var max = Number($("maxScore").value);
    var score = Number($("score").value);

    if (
      !Number.isFinite(max) ||
      max <= 0 ||
      max > 10000 ||
      !Number.isFinite(score) ||
      score < 0 ||
      score > max
    ) {
      message(
        "formMsg",
        "点数は0以上、満点以下にしてください"
      );
      return;
    }

    var record = {
      subject: $("subject").value,
      scope: $("scope").value.trim(),
      test_date: $("testDate").value,
      max_score: max,
      score: score
    };

    if (!record.scope) {
      message(
        "formMsg",
        "テスト範囲を入力してください"
      );
      return;
    }

    $("save").disabled = true;
    message("formMsg", "保存しています…");

    try {
      var result;

      if (editing) {
        result = await db
          .from("test_scores")
          .update(record)
          .eq("id", editing);
      } else {
        result = await db
          .from("test_scores")
          .insert({
            ...record,
            user_id: currentUser.id
          });
      }

      if (result.error) throw result.error;

      resetForm();
      await load();

      message("formMsg", "保存できました！", true);
    } catch (error) {
      message("formMsg", errorText(error));
    } finally {
      $("save").disabled = false;
    }
  }

  async function login() {
    if (!db) {
      message(
        "authMsg",
        "Supabaseが初期化されていません"
      );
      return;
    }

    var email = $("email").value.trim();
    var password = $("password").value;

    if (!email || !password) {
      message(
        "authMsg",
        "メールアドレスとパスワードを入力してください。"
      );
      return;
    }

    message("authMsg", "ログインしています…");
    $("login").disabled = true;

    try {
      var result = await db.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (result.error) throw result.error;

      message(
        "authMsg",
        "ログインしました。",
        true
      );
    } catch (error) {
      message("authMsg", errorText(error));
    } finally {
      $("login").disabled = false;
    }
  }

  async function signup() {
    var email = $("email").value.trim();
    var password = $("password").value;

    if (!email || !password) {
      message(
        "authMsg",
        "メールアドレスとパスワードを入力してください。"
      );
      return;
    }

    if (!db) {
      message(
        "authMsg",
        "Supabaseが初期化されていません"
      );
      return;
    }

    message(
      "authMsg",
      "登録を処理しています…"
    );

    $("signup").disabled = true;

    try {
      var result = await db.auth.signUp({
        email: email,
        password: password,
        options: {
          emailRedirectTo:
            "https://t71316372-crypto.github.io/test-score-tracker/"
        }
      });

      if (result.error) throw result.error;

      if (result.data.session) {
        message(
          "authMsg",
          "登録できました！",
          true
        );
      } else {
        message(
          "authMsg",
          "確認メールを確認してください。",
          true
        );
      }
    } catch (error) {
      message("authMsg", errorText(error));
    } finally {
      $("signup").disabled = false;
    }
  }

  async function sessionChanged(session) {
    currentUser = session ? session.user : null;

    $("auth").classList.toggle(
      "hide",
      !!currentUser
    );

    $("app").classList.toggle(
      "hide",
      !currentUser
    );

    $("logout").classList.toggle(
      "hide",
      !currentUser
    );

    if (currentUser) {
      resetForm();
      await load();
    } else {
      items = [];
      $("records").replaceChildren();
    }
  }

  function loadSupabase() {
    message(
      "authMsg",
      "Supabaseを読み込んでいます…"
    );

    var script = document.createElement("script");

    script.src =
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js";

    script.onload = function () {
      try {
        if (
          !window.supabase ||
          !window.supabase.createClient
        ) {
          throw new Error(
            "Supabaseライブラリが利用できません"
          );
        }

        db = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

        db.auth.onAuthStateChange(
          function (event, session) {
            setTimeout(function () {
              sessionChanged(session).catch(report);
            }, 0);
          }
        );

        ready = true;
        message(
          "authMsg",
          "アプリの準備ができました。",
          true
        );

      } catch (error) {
        report(error);
      }
    };

    script.onerror = function () {
      message(
        "authMsg",
        "Supabaseの読み込みに失敗しました。"
      );
    };

    document.head.appendChild(script);
  }

  function init() {
    $("login").addEventListener("click", login);
    $("signup").addEventListener("click", signup);

    $("scoreForm").addEventListener(
      "submit",
      saveRecord
    );

    $("cancel").addEventListener(
      "click",
      resetForm
    );

    $("filter").addEventListener(
      "change",
      render
    );

    $("logout").addEventListener(
      "click",
      async function () {
        if (!db) return;

        try {
          var result = await db.auth.signOut();
          if (result.error) throw result.error;
        } catch (error) {
          alert(errorText(error));
        }
      }
    );

    resetForm();
    loadSupabase();
  }

  try {
    init();
  } catch (error) {
    report(error);
  }

})();
</script>
</body>
</html>
